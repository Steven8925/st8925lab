<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST8925 LAB</title>
<meta name="description" content="旋轉的夜間地球，五大洲以城市燈光顯示輪廓，外圈六道傾斜軌道上有光點環繞並隨滑鼠呼吸。Rotating night Earth with city-light continents and six breathing orbit rings.">
<style>
    :root {
        --bg: #04070e;
        --text: #e8eef7;
        --muted: #64748b;
        --bar-h: 64px;                 /* 導覽列高度 / top bar height */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    /* ===========================================================
       頂部導覽列 / Top bar
       毛玻璃：軌道呼吸時最大可達 288px，會通到列後方。
       Frosted glass: the orbit reaches 288px at peak breath and
       passes behind the bar.
       =========================================================== */
    #topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: var(--bar-h);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 clamp(1rem, 3vw, 2.25rem);
        background: rgba(4, 7, 14, 0.55);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* --- 站名 / Wordmark --------------------------------------
       色彩由 JS 每幀寫入（5 秒正弦亦滅），故此處不設 color。
       Colour is written per frame by JS (5 s sine pulse), so no
       colour is declared here.
       ---------------------------------------------------------- */
    #wordmark {
        display: inline-flex;
        align-items: baseline;
        font-size: clamp(1rem, 2.2vw, 1.45rem);
        font-weight: 700;
        letter-spacing: .16em;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        /* 放大時不撐開版面 / magnified glyphs must not reflow the bar */
        padding: .35rem 0;
        flex: none;
    }
    #wordmark .glyph {
        display: inline-block;
        /* 由 JS 每幀寫入 transform，故不設 transition，
           否則會與阻尼插值疊加成雙重延遲。
           JS writes transform every frame, so no transition here —
           it would compound with the damping into a double lag. */
        transform-origin: 50% 100%;
        will-change: transform;
    }
    #wordmark .glyph.space { width: .5em; }

    /* --- 專案導覽 / Project nav -------------------------------- */
    #projects {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(.4rem, 1.4vw, 1.4rem);
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
    }
    #projects::-webkit-scrollbar { display: none; }
    .project {
        --c: #ffffff;
        display: inline-flex;
        align-items: center;
        gap: .45rem;
        color: var(--c);
        text-decoration: none;
        font-size: clamp(.62rem, 1.1vw, .78rem);
        font-weight: 600;
        letter-spacing: .1em;
        padding: .42rem .7rem;
        border: 1px solid color-mix(in srgb, var(--c) 24%, transparent);
        border-radius: 7px;
        background: color-mix(in srgb, var(--c) 5%, transparent);
        transition: transform .18s ease, box-shadow .18s ease,
                    background .18s ease, border-color .18s ease;
        white-space: nowrap;
        flex: none;
    }
    .project .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 7px var(--c);
        flex: none;
    }
    .project:hover, .project:focus-visible {
        transform: translateY(-2px);
        border-color: var(--c);
        background: color-mix(in srgb, var(--c) 13%, transparent);
        box-shadow: 0 0 16px color-mix(in srgb, var(--c) 38%, transparent);
        outline: none;
    }

    /* --- 右側按鈕 / Right-hand CTA ----------------------------- */
    #cta {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        font-size: clamp(.62rem, 1.1vw, .78rem);
        font-weight: 600;
        letter-spacing: .1em;
        color: #cbd5e1;
        text-decoration: none;
        padding: .45rem .95rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        transition: background .18s ease, border-color .18s ease, color .18s ease;
        white-space: nowrap;
    }
    #cta:hover, #cta:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.34);
        color: #ffffff;
        outline: none;
    }

    /* ===========================================================
       舞台 / Stage
       =========================================================== */
    #stage {
        position: absolute;
        inset: 0;
        cursor: grab;
        touch-action: none;
    }
    #stage:active { cursor: grabbing; }
    #scene { display: block; width: 100%; height: 100%; }

    /* ===========================================================
       時間列 / Clock row
       置於地球下方。地球半徑 130px，故偏移量須大於 130 加上
       呼吸最小時的軌道 211px 才不會被壓到。
       Sits below the globe. The offset must clear the orbit at its
       smallest breath (211px), not just the 130px globe.
       =========================================================== */
    #clock {
        position: fixed;
        left: 50%;
        top: calc(50% + var(--bar-h) / 2 + 250px);
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: .8rem;
        white-space: nowrap;
        font-size: clamp(.6rem, 1.15vw, .8rem);
        font-weight: 600;
        letter-spacing: .06em;
        z-index: 15;
        pointer-events: none;
        user-select: none;
    }
    /* 顏色由 JS 於載入時抽色寫入 / colour is assigned by JS on load */
    #clock .sep { color: #334155; }

    #hint {
        position: fixed; bottom: 14px; left: 50%;
        transform: translateX(-50%);
        font-size: 10px; letter-spacing: .08em; color: var(--muted);
        pointer-events: none; user-select: none;
        z-index: 15;
    }

    /* ===========================================================
       地球旁地理位置標籤列 / Location panel beside Earth
       =========================================================== */
    #location-panel {
        position: fixed;
        left: clamp(1.2rem, 3.5vw, 3rem);
        top: 50%;
        transform: translateY(-50%);
        z-index: 15;
        display: flex;
        flex-direction: column;
        gap: .6rem;
        padding: .85rem 1.1rem;
        background: rgba(4, 7, 14, 0.6);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        user-select: none;
        pointer-events: auto;
        min-width: 170px;
        transition: opacity .3s ease, transform .3s ease;
    }
    #location-panel .loc-header {
        display: flex;
        align-items: center;
        gap: .45rem;
        font-size: .62rem;
        font-weight: 700;
        letter-spacing: .12em;
        color: var(--muted);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: .45rem;
    }
    #location-panel .loc-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ff4040;
        box-shadow: 0 0 8px #ff4040;
        flex: none;
    }
    #location-panel #loc-list {
        display: flex;
        flex-direction: column;
        gap: .55rem;
    }
    .loc-item {
        display: flex;
        flex-direction: column;
        gap: .15rem;
    }
    .loc-item-header {
        display: flex;
        align-items: center;
        gap: .4rem;
    }
    .loc-item-dot {
        width: 4px; height: 4px; border-radius: 50%;
        background: #ff6b6b;
        flex: none;
    }
    .loc-name {
        font-size: .75rem;
        font-weight: 700;
        color: #e8eef7;
        letter-spacing: .08em;
    }
    .loc-coords {
        font-size: .65rem;
        color: #94a3b8;
        letter-spacing: .04em;
        padding-left: .8rem;
    }

    @media (max-width: 900px) {
        #location-panel {
            left: 1rem;
            padding: .65rem .85rem;
            min-width: 140px;
        }
    }
    @media (max-width: 720px) {
        #location-panel {
            top: calc(var(--bar-h) + 12px);
            left: 50%;
            transform: translateX(-50%);
            flex-direction: row;
            align-items: center;
            min-width: 0;
            padding: .45rem .8rem;
            gap: .8rem;
        }
        #location-panel .loc-header {
            border-bottom: none;
            padding-bottom: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding-right: .6rem;
        }
        #location-panel #loc-list {
            flex-direction: row;
            gap: .8rem;
        }
        .loc-item {
            flex-direction: row;
            align-items: center;
            gap: .4rem;
        }
        .loc-coords {
            padding-left: 0;
        }
    }

    /* 矮螢幕：時間列改貼底部，避免與軌道重疊 */
    /* Short viewports: pin the clock to the bottom instead of overlapping */
    @media (max-height: 760px) {
        #clock { top: auto; bottom: 40px; }
    }
    @media (max-width: 560px) {
        #clock { flex-direction: column; gap: .2rem; }
        #clock .sep { display: none; }
    }

    @media (max-width: 720px) {
        :root { --bar-h: 56px; }
        #cta { display: none; }        /* 小螢幕讓出空間 / reclaim space */
    }
    @media (prefers-reduced-motion: reduce) {
        .project, #cta { transition: none; }
    }
</style>
</head>
<body>

<header id="topbar">
    <a id="wordmark" href="#top" aria-label="ST8925 LAB"></a>
    <nav id="projects" aria-label="Projects"></nav>
    <a id="cta" href="#contact">CONTACT</a>
</header>

<aside id="location-panel" aria-label="Geographical Locations">
    <div class="loc-header">
        <span class="loc-dot"></span>
        <span class="loc-title">LOCATIONS / 地標位置</span>
    </div>
    <div id="loc-list"></div>
</aside>

<div id="stage">
    <canvas id="scene"></canvas>
</div>

<div id="clock">
    <span id="clock-local"></span>
    <span class="sep">·</span>
    <span id="clock-gmt8"></span>
</div>

<div id="hint">拖曳旋轉 · drag to rotate · 雙擊重置 · double-click to reset</div>

<script src="geodata.js"></script>
<script src="app.js"></script>
</body>
</html>
