<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST8925 LAB — Project</title>
<meta name="description" content="Placeholder project page for ST8925 LAB. 臨時專案頁面。">
<style>
    :root {
        --bg: #04070e;
        --text: #e8eef7;
        --muted: #64748b;
        --c: #ffffff;                  /* overwritten per project by JS */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 40px 24px;
        text-align: center;
    }

    /* Halo echoing the light point that was clicked to get here.
       呼應點擊而來的光點。 */
    #halo {
        width: 86px; height: 86px;
        border-radius: 50%;
        background: radial-gradient(circle,
                    #fff 0%, var(--c) 38%, transparent 72%);
        box-shadow: 0 0 44px 10px color-mix(in srgb, var(--c) 55%, transparent);
        animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1);    opacity: .92; }
        50%      { transform: scale(1.14); opacity: 1;   }
    }

    h1 {
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 600;
        letter-spacing: .06em;
        color: var(--c);
    }
    .sub { color: var(--muted); font-size: 13px; letter-spacing: .18em; }

    /* Proof the colour survived the jump from the orbit to this page.
       證明顏色自軌道傳遞至此頁未失真。 */
    #proof {
        border: 1px solid color-mix(in srgb, var(--c) 34%, transparent);
        border-radius: 10px;
        padding: 16px 22px;
        font-size: 12.5px;
        line-height: 2;
        color: var(--muted);
        text-align: left;
        min-width: min(420px, 90vw);
    }
    #proof b { color: var(--c); font-weight: 600; }

    #back {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        letter-spacing: .1em;
        border-bottom: 1px solid transparent;
        padding-bottom: 2px;
        transition: color .2s, border-color .2s;
    }
    #back:hover { color: var(--c); border-color: var(--c); }

    /* Index fallback, shown when no ?id= is present — which is what happens
       when the file is opened directly via file:// in some browsers.
       無 ?id= 參數時顯示索引，涵蓋 file:// 直接開啟的情況。 */
    #index { display: none; }
    #index.on { display: block; }
    #index ul { list-style: none; display: flex; flex-wrap: wrap;
                gap: 10px; justify-content: center; margin-top: 18px; }
    #index a {
        display: block; padding: 9px 15px; border-radius: 8px;
        text-decoration: none; font-size: 13px;
        border: 1px solid currentColor;
    }
    #main.off { display: none; }
</style>
</head>
<body>

<div id="main">
    <div id="halo"></div>
    <h1 id="title">Welcome to Project</h1>
    <div class="sub" id="subtitle">ST8925 LAB</div>
    <div id="proof"></div>
    <a id="back" href="./">&larr; BACK TO ORBIT</a>
</div>

<div id="index">
    <h1>ST8925 LAB</h1>
    <div class="sub" style="margin-top:12px">SELECT A PROJECT</div>
    <ul id="index-list"></ul>
    <div style="margin-top:26px"><a id="back" href="./">&larr; BACK TO ORBIT</a></div>
</div>

<script src="config.js"></script>
<script>
// This page loads config.js only — NOT app.js, which needs the canvas and
// the geodata. Sharing the config file is what guarantees the two pages can
// never disagree about a project's identity or colour.
// 本頁只載入 config.js（不載入 app.js，後者需要 canvas 與地理資料）。
// 共用設定檔即可保證兩頁對專案與配色的認知一致。

const params = new URLSearchParams(location.search);
const id  = params.get('id');
const hue = params.get('hue');   // set by the orbit page, see PROJECT_URL

// Colour assignment must match the orbit page's rule: ring index i takes
// palette entry i. The homepage SHUFFLES per load, so the hue here will not
// always equal the hue that was just clicked — see the note rendered below.
// 配色規則與首頁一致（第 i 環取第 i 色）；但首頁每次載入洗牌，
// 故此處色相未必等於剛才點擊的顏色，下方已註明。
const idx = PROJECTS.findIndex(p => p.id === id);

if (idx === -1) {
    document.getElementById('main').classList.add('off');
    document.getElementById('index').classList.add('on');
    const ul = document.getElementById('index-list');
    PROJECTS.forEach((p, i) => {
        const a = document.createElement('a');
        a.href = `project.html?id=${p.id}`;
        a.textContent = p.label;
        a.style.color = RAINBOW[i % RAINBOW.length].hex;
        const li = document.createElement('li');
        li.appendChild(a);
        ul.appendChild(li);
    });
} else {
    const proj = PROJECTS[idx];
    // Prefer the hue handed over by the orbit page, since that is the colour
    // the user actually clicked. Fall back to the palette index only when the
    // page is opened directly (bookmark, index list, typed URL).
    // 優先採用首頁傳來的色相（即使用者實際點到的顏色）；
    // 僅在直接開啟本頁（書籤、索引、手動輸入網址）時才退回索引配色。
    const col  = RAINBOW.find(c => c.name === hue) || RAINBOW[idx % RAINBOW.length];
    document.documentElement.style.setProperty('--c', col.hex);
    document.title = `ST8925 LAB — ${proj.label}`;
    document.getElementById('title').textContent = `Welcome to ${proj.label}`;
    document.getElementById('proof').innerHTML = `
        <div>project id &nbsp; <b>${proj.id}</b></div>
        <div>ring index &nbsp; <b>${idx}</b> &nbsp;<span style="opacity:.6">(0-based)</span></div>
        <div>palette hue &nbsp; <b>${col.name}</b> &nbsp; <b>${col.hex}</b></div>
        <div>total projects &nbsp; <b>${PROJECTS.length}</b></div>
        <div style="opacity:.62;letter-spacing:0;line-height:1.55;margin-top:9px">
          Placeholder page. 臨時頁面。<br>
          ${hue ? 'Hue carried over from the orbit you clicked. 色相由點擊的軌道傳遞而來。'
                : 'Opened directly, so the hue falls back to the palette index. 直接開啟，色相退回索引配色。'}
        </div>`;
}
</script>

</body>
</html>
