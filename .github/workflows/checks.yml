# st8925lab — 持續整合檢查 / continuous checks
#
# 為什麼這個檔案存在 / Why this exists
# ------------------------------------
# 2026-09-24 山姆哥問「怎麼越來越多問題浮出」。盤點後的第一個結構性成因就是：
# 父專案與 submodule **都沒有 CI**。沒有任何東西在兩次工作之間攔截回歸，所以
# 每個缺陷都只能等人眼下次翻到時才被發現 —— 問題不是變多，是終於被找到。
#
# 依裁示 5B：能機器判定的一律以離開碼判定，不以任何人的說法判定。
#
# submodule 的處置 / On the submodule
# -----------------------------------
# `Travel-Assistance` 是 **私有** repo（2026-09-24 查證：parent 為 PUBLIC，
# submodule 為 PRIVATE），而 Actions 的預設 GITHUB_TOKEN 只對本 repo 有權限，
# 所以 `submodules: recursive` 會直接失敗：
#     fatal: repository '.../Travel-Assistance.git/' not found
#
# 這個失敗本身是重要情報，不是雜訊：**Cloudflare Workers Builds 也是從 GitHub
# clone**。若它同樣取不到這個私有 submodule，`Travel-Assistance/index.html`
# 就不在資產庫裡，P06 在正式站是 404 —— 而本機開發一切正常。
# 詳見 DEFECTS.md 的 S-6，該項待實測確認。
#
# 在山姆哥決定（公開該 repo／加 PAT secret／維持現狀）之前，本工作流不取出
# submodule，檢查腳本會明確把相關項目標為 SKIP 而非 FAIL —— 為了一個環境限制
# 讓 CI 永遠紅燈，等於訓練大家忽略 CI。
# 後端測試需要 submodule 內容，因此屬於該 repo 自己的 CI，不放在這裡。

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-and-links:
    name: 公開暴露面、連結、單一真理源 / surface, links, single source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（不含私有 submodule，見檔頭說明）
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 記錄 submodule 取出狀態 / record submodule availability
        run: |
          if [ -f Travel-Assistance/index.html ]; then
            echo "Travel-Assistance submodule: 已取出"
          else
            echo "Travel-Assistance submodule: 未取出（私有 repo）。"
            echo "相關檢查將標為 SKIP。見 DEFECTS.md S-6。"
          fi

      # 三支檢查彼此獨立，任一失敗都要讓整個工作失敗，
      # 但仍要看到其他兩支的輸出 —— 所以用 if: always() 串起來。
      - name: 公開暴露面 / public surface
        run: python tools/check_public_surface.py

      - name: 連結完整性 / link integrity
        if: always()
        run: python tools/check_links.py

      - name: 單一真理源 / single source of truth
        if: always()
        run: python tools/check_single_source.py
