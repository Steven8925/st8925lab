# st8925lab — 持續整合檢查 / continuous checks
#
# 為什麼這個檔案存在 / Why this exists
# ------------------------------------
# 2026-09-24 山姆哥問「怎麼越來越多問題浮出」。盤點後的第一個結構性成因就是：
# 父專案與 submodule **都沒有 CI**。沒有任何東西在兩次工作之間攔截回歸，所以
# 每個缺陷都只能等人眼下次翻到時才被發現 —— 問題不是變多，是終於被找到。
#
# 這份工作流把已經腳本化的檢查接上自動執行。依裁示 5B：能機器判定的一律以
# 離開碼判定，不以任何人的說法判定。
#
# There was no CI in either repository, so nothing caught regressions between
# sessions. Every defect had to be found by eye. This wires the existing
# exit-code-judged checks into automatic execution.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-and-links:
    name: 公開暴露面、連結、單一真理源 / surface, links, single source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含 submodule）
        uses: actions/checkout@v4
        with:
          # Travel-Assistance 是 submodule。不取出它，連結檢查會以為 P06 不存在。
          # 這一步同時順便驗證了 submodule 在 CI 環境中確實可取得。
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 三支檢查彼此獨立，任何一支失敗都要讓整個工作失敗，
      # 但仍要看到其他兩支的輸出 —— 所以用 if: always() 串起來。
      - name: 公開暴露面 / public surface
        run: python tools/check_public_surface.py

      - name: 連結完整性 / link integrity
        if: always()
        run: python tools/check_links.py

      - name: 單一真理源 / single source of truth
        if: always()
        run: python tools/check_single_source.py

  backend-tests:
    name: 後端測試 / backend test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Travel-Assistance/backend/requirements.txt

      - name: 安裝相依 / install dependencies
        working-directory: Travel-Assistance/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pytest.ini 已設 --disable-socket，測試不會對外連線。
      # 兩個 TDD-RED 模組帶 xfail(strict=True)：實作完成轉綠時會以 XPASS 失敗，
      # 強制移除標記 —— 那是刻意的提醒機制，不是壞掉。
      - name: pytest
        working-directory: Travel-Assistance/backend
        run: python -m pytest
