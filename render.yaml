# Render Blueprint — Alarm Notification Simulator backend
# 告警通知模擬台後端部署藍圖
#
# Deploys the two Node.js services that Project 01 (alarm-notification-simulator)
# needs. The frontend (apps/web) is NOT deployed here — it is built as a static
# bundle and served by Cloudflare Pages alongside the rest of st8925lab.com.
#
# 部署 Project 01（alarm-notification-simulator）所需的兩個 Node.js 服務。
# 前端（apps/web）不在這裡部署 —— 它被打包成靜態檔案，隨 st8925lab.com
# 其餘部分一起由 Cloudflare Pages 提供。
#
# How to use / 使用方式:
#   1. Render dashboard -> New -> Blueprint -> connect the st8925lab GitHub repo.
#   2. Render auto-detects this file at the repo root.
#   3. After the first deploy, open EACH service's Environment tab and fill in
#      the variables marked `sync: false` below (Render leaves these blank on
#      purpose so no secret ever sits in the public git history).
#   4. INTERNAL_WEBHOOK_SECRET MUST be the exact same value on BOTH services —
#      it is how the ops-server proves its webhooks to the api. Generate one
#      value and paste it into both. A quick way to generate one:
#        node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#
# Known caveat / 已知限制: both services are on Render's free tier, which
# sleeps after 15 minutes idle (first request after that takes ~30-60s to wake)
# and has an EPHEMERAL filesystem — the SQLite database resets to freshly-seeded
# demo data on every restart. This is an accepted trade-off for a public demo
# with fake data, not a bug. See alarm-notification-simulator/README.md.

services:
  - type: web
    name: st8925lab-alarm-api
    runtime: node
    plan: free
    rootDir: alarm-notification-simulator/source
    # `--include=dev` is REQUIRED, not defensive: npm omits devDependencies
    # whenever NODE_ENV=production (set below), and this service needs two of
    # them — `prisma` (the CLI, for generate + migrate deploy, build time) and
    # `tsx` (which startCommand runs the server with, RUN time). Without the
    # flag the build dies at `db:generate` with "prisma: not found", and even
    # if it survived, startCommand would fail the same way on `tsx`.
    # `--include=dev` 是必要而非保險：NODE_ENV=production 時 npm 會略過
    # devDependencies，而本服務需要其中兩個——`prisma`（CLI，建置期用於
    # generate 與 migrate deploy）與 `tsx`（startCommand 用它啟動伺服器，
    # 執行期）。少了這個旗標，建置會在 db:generate 直接失敗。
    buildCommand: >
      npm install --include=dev &&
      mkdir -p data &&
      npm run db:generate -w @alarm/api &&
      npm exec -w @alarm/api -- prisma migrate deploy &&
      npm run db:seed -w @alarm/api
    startCommand: npm run start -w @alarm/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_PORT
        value: 3000
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: "file:./data/dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: INTERNAL_WEBHOOK_SECRET
        sync: false
      - key: PUSH_PROVIDER
        value: simulator
      - key: SIMULATOR_RECEIPT_DELAY_MS
        value: 3000
      - key: SOURCE_POLL_ENABLED
        value: "true"
      - key: SOURCE_POLL_INTERVAL_MS
        value: 5000
      - key: SOURCE_POLL_URL
        value: https://st8925lab-alarm-ops.onrender.com/v1/source-events/claim
      - key: ALARM_REFERENCE_TIMEZONE
        value: Asia/Taipei
      - key: TEST_DATA_RETENTION_DAYS
        value: 3
      - key: TEST_DATA_RETENTION_SWEEP_MS
        value: 3600000
      # Comma-separated exact-match origins (apps/api/src/config.ts splits on
      # ",", trims, and hands the list to @fastify/cors — there is no wildcard
      # or suffix matching, so every origin the console is actually served
      # from must be listed literally, scheme included).
      # If you preview the site from a *.workers.dev / *.pages.dev URL, that
      # origin must be added here too or the console will load but every
      # request will fail CORS. Same applies to OPS_CORS_ORIGIN below.
      - key: CORS_ORIGIN
        value: https://st8925lab.com,https://www.st8925lab.com
      - key: SEED_MANAGER_EMAIL
        value: manager@demo.local
      - key: SEED_ADMIN_EMAIL
        value: admin@demo.local
      - key: SEED_PASSWORD
        value: Demo-Alarm-2026

  - type: web
    name: st8925lab-alarm-ops
    runtime: node
    plan: free
    rootDir: alarm-notification-simulator/source
    # Same reason as the api service above: startCommand runs the server with
    # `tsx`, which is a devDependency, and NODE_ENV=production would otherwise
    # make npm skip it.
    # 與上方 api 服務同理：startCommand 以 `tsx` 啟動，而它是 devDependency。
    buildCommand: npm install --include=dev
    startCommand: npm run start -w @alarm/ops-server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: OPS_PORT
        value: 4000
      - key: PORT
        value: 4000
      - key: NOTIFICATION_API_BASE_URL
        value: https://st8925lab-alarm-api.onrender.com
      - key: INTERNAL_WEBHOOK_SECRET
        sync: false
      - key: OPS_CORS_ORIGIN
        value: https://st8925lab.com,https://www.st8925lab.com

  - type: web
    name: st8925lab-ai-diagnostic-kb
    runtime: python
    plan: free
    rootDir: ai-diagnostic-kb/source/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "768"
      - key: CORS_ORIGINS
        value: https://st8925lab.com,https://www.st8925lab.com,http://localhost:5173,http://localhost:3000

