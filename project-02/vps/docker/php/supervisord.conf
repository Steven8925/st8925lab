[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# 1. Background IoT Batch Flush & Rule Engine Worker
[program:iot-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan iot:worker
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/iot-worker.log
stopwaitsecs=3600

# 2. Redis Standard Queue Worker (Notification Dispatcher)
[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/laravel-queue.log
stopwaitsecs=3600
