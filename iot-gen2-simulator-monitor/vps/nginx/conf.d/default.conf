# =========================================================================
#  Nginx Production Configuration: Wayne IoT Server Gen 2
#  負載平衡、SSL 終結、靜態快取與極速 API 轉發
# =========================================================================

upstream php_app {
    server app:9000;
    keepalive 32;
}

upstream ai_app {
    server ai-service:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Client Request Limits
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    root /var/www/html/public;
    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1. IoT Ingestion API Endpoint (Ultra-Low Latency)
    location /api/iot/ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off; # Disable access log for high-frequency IoT ingest to save disk I/O
    }

    # 2. AI Predictive Microservice Proxy
    location /api/ai/ {
        proxy_pass http://ai_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 3. Standard API & Web Dashboard
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. FastCGI PHP Execution
    location ~ \.php$ {
        fastcgi_pass php_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # 5. Deny Hidden Files
    location ~ /\. {
        deny all;
    }
}
